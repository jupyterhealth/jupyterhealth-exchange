[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jhe-mcp"
version = "0.1.0"
description = "MCP server for JupyterHealth Exchange"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the patch series: per-request auth relies on the non-public
    # import mcp.server.lowlevel.server.request_ctx (see fhir/client.py). A
    # minor bump could relocate it; assert_request_ctx_importable() guards at
    # boot, and this narrow pin keeps upgrades deliberate.
    "mcp>=1.29.0,<1.31",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "fastapi>=0.140.13,<1",
    "uvicorn[standard]>=0.51.0,<1",
    # First-party. Floor must cover every code JHE seeds — see
    # tests/unit/test_omh_registry.py drift guard; 2.0.0 resolves IEEE first
    # (sleep_duration -> ieee:total-sleep-time:1.0, matching the seed since #777).
    # Capped below the next major so a converter remap cannot land automatically.
    "omh-shim>=2.0.0,<3",
    "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",
    "ruff>=0.16.0",
]

[project.scripts]
jhe-mcp-stdio = "jhe_mcp.server_stdio:main"
jhe-mcp-http = "jhe_mcp.server_http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
