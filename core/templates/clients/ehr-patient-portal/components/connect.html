{% verbatim %}
<script id="t-connect" type="text/template">
  <a class="pf-back" href="#" onclick="pfNav('hub'); return false;"><i class="bi bi-arrow-left"></i> Back</a>
  {{> rail rail}}
  <p class="pf-eyebrow">Clinical records</p>

  <div id="hospital-picker" hidden>
    <label for="hospital-search" class="pf-eyebrow pf-eyebrow--tight">Find your healthcare organization</label>
    <div class="pf-search">
      <input id="hospital-search" type="search" class="pf-input" placeholder="Search by hospital name, city, or state" autocomplete="off" />
      <div id="hospital-results"></div>
    </div>
  </div>
</script>
